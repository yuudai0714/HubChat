<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'">
  <title>HubChat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <div id="sidebar">
    <div id="sidebar-header">
      <div id="app-logo" title="HubChat"><img src="logo.png" alt="HubChat" style="width:28px;height:28px;border-radius:6px;"></div>
    </div>
    <div id="sidebar-services"></div>
    <div id="sidebar-footer">
      <div class="sidebar-divider"></div>
      <button id="add-btn" class="sidebar-icon-btn" title="サービスを追加">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="main-content">

    <!-- 上部バー（常時表示・ドラッグ移動可能） -->
    <div id="topbar">
      <div id="topbar-nav">
        <button id="nav-back" class="nav-btn" title="戻る">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <button id="nav-forward" class="nav-btn" title="進む">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
        <button id="nav-reload" class="nav-btn" title="再読み込み">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
        </button>
      </div>
      <div id="topbar-title"><span id="nav-url"></span></div>
      <!-- 中央の空きスペース＝ウィンドウ移動用ドラッグ領域 -->
      <div id="topbar-drag"></div>
      <!-- 右側：ウィジェットスロット -->
      <div id="topbar-widgets">
        <button id="topbar-search" class="topbar-widget-btn" title="クイック検索 (⌘K)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <span class="topbar-widget-kbd">⌘K</span>
        </button>
        <div class="topbar-divider"></div>
        <button id="update-btn" class="topbar-icon-btn topbar-icon-btn--update" title="アップデート" style="display:none;position:relative;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <span class="update-pulse-dot"></span>
        </button>
        <button id="learn-btn" class="topbar-icon-btn" title="学習">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </button>
        <button id="help-btn" class="topbar-icon-btn" title="ヘルプ">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </button>
        <button id="plan-btn" class="topbar-icon-btn topbar-icon-btn--plan" title="プラン">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
          </svg>
        </button>
        <button id="settings-btn" class="topbar-icon-btn" title="設定">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="welcome-screen">
      <div class="welcome-inner">
        <div class="welcome-logo"><img src="logo.png" alt="HubChat" style="width:64px;height:64px;border-radius:12px;"></div>
        <h1>HubChatへようこそ</h1>
        <p>左下の <strong>＋</strong> ボタンからサービスを追加してください</p>
        <button id="welcome-add-btn" class="primary-btn">サービスを追加する</button>
      </div>
    </div>

    <div id="webview-container" style="display:none">

      <div id="popup-overlay">
        <div id="popup-toolbar">
          <button id="popup-back-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
            戻る
          </button>
          <span id="popup-title"></span>
          <button id="popup-close-btn" style="padding:5px 12px;background:rgba(255,255,255,0.1);border:none;border-radius:6px;color:#fff;font-size:13px;cursor:pointer;">✕ 閉じる</button>
        </div>
        <webview id="popup-webview" allowpopups></webview>
      </div>

    </div>

  </div>

</div>

<div id="service-modal" class="modal hidden">
  <div class="modal-overlay" id="modal-overlay"></div>
  <div class="modal-box">
    <div class="modal-header">
      <h2>サービスを追加</h2>
      <button class="close-btn" id="modal-close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div id="settings-modal" class="modal hidden">
  <div class="modal-overlay" id="settings-overlay"></div>
  <div class="modal-box modal-narrow">
    <div class="modal-header">
      <h2>設定</h2>
      <button class="close-btn" id="settings-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="settings-section">
        <h3>テーマ</h3>
        <div class="theme-btns">
          <button class="theme-btn" data-theme="dark">🌙 ダーク</button>
          <button class="theme-btn" data-theme="light">☀️ ライト</button>
        </div>
      </div>
      <div class="settings-section">
        <h3>追加済みサービス</h3>
        <div id="service-manage-list"></div>
      </div>
      <div class="settings-section settings-danger">
        <h3>データ管理</h3>
        <button id="reset-btn" class="danger-btn">全データをリセット</button>
      </div>
    </div>
  </div>
</div>



<div id="ctx-menu" class="ctx-menu hidden">
  <div id="ctx-hide">👁 非表示にする</div>
  <div id="ctx-remove" class="ctx-danger">🗑 削除する</div>
</div>

<script src="app.js"></script>
  <!-- Help / Q&A Modal -->
  <div id="plan-modal" class="modal hidden">
  <div class="modal-overlay" id="plan-overlay"></div>
  <div class="modal-box modal-narrow">
    <div class="modal-header">
      <h2>プラン</h2>
      <button class="close-btn" id="plan-close">✕</button>
    </div>
    <div class="modal-body">
      <div id="plan-status" style="margin-bottom:12px;font-size:13px;color:var(--text-sub);">現在のプラン：<strong>フリー</strong>（3サービスまで）</div>
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <input type="text" id="plan-key-input" placeholder="ライセンスキーを入力" style="flex:1;padding:8px 12px;border-radius:8px;border:1px solid var(--bg-hover);background:var(--bg-main);color:var(--text-main);font-size:13px;">
        <button id="plan-verify-btn" style="padding:8px 16px;background:var(--accent);color:#11111b;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;">認証</button>
      </div>
      <button id="plan-upgrade-btn" style="width:100%;padding:10px;background:#06C755;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;">プロプランにアップグレード（月額550円）</button>
    </div>
  </div>
</div>

<div id="learn-modal" class="modal hidden">
  <div class="modal-overlay" id="learn-overlay"></div>
  <div class="modal-box" style="width:860px;max-width:95vw;">
    <div class="modal-header">
      <h2>📚 スキルアップ</h2>
      <button id="learn-close-btn" class="close-btn">✕</button>
    </div>
    <div class="modal-body" id="learn-content">
      <p style="color:var(--text-sub);text-align:center;padding:40px 0;">読み込み中...</p>
    </div>
  </div>
</div>

<div id="learn-article-modal" class="modal hidden">
  <div class="modal-overlay" id="learn-article-overlay"></div>
  <div class="modal-box" style="width:900px;max-width:95vw;max-height:90vh;">
    <div class="modal-header">
      <h2 id="learn-article-title" style="font-size:16px;"></h2>
      <button id="learn-article-close-btn" class="close-btn">✕</button>
    </div>
    <div style="flex:1;overflow:hidden;">
      <webview id="learn-article-webview" style="width:100%;height:100%;min-height:500px;" allowpopups></webview>
    </div>
  </div>
</div>

<div id="help-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="help-modal-content">
      <div class="help-header">
        <h2>ヘルプ・Q&A</h2>
        <button id="help-close-btn" class="modal-close-btn">✕</button>
      </div>
      <div class="help-body">
        <div class="faq-search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="faq-search-input" type="text" placeholder="質問・キーワードで検索（例：ログイン、通知、ショートカット）" autocomplete="off" spellcheck="false">
          <button id="faq-search-clear" title="クリア" style="display:none;">✕</button>
        </div>
        <div id="faq-version">
          <span>バージョン <strong id="current-version">…</strong></span>
          <span id="version-status"></span>
          <span id="version-update-area" style="display:none;"></span>
        </div>
        <div id="faq-cats"></div>
        <div id="faq-list"></div>
      </div>
    </div>
  </div>
</body>
</html>
